appId: com.showhisper.app
productName: SHOWhisper

mac:
  icon: assets/icon.icns
  # Ad-hoc code signing ("-"): free, no Apple Developer account. Apple Silicon
  # rejects an entirely unsigned app with the hard "app is damaged" error; an
  # ad-hoc signature turns that into the milder "cannot be verified" prompt that
  # users can bypass via right-click → Open (or System Settings → Open Anyway).
  # Fully frictionless opening still requires a Developer ID + notarization.
  identity: "-"
  # Hardened runtime enables library validation, which (combined with ad-hoc
  # signing) blocks our unsigned native prebuilds (onnxruntime-node, nut-js) at
  # launch. We don't notarize, so hardened runtime buys us nothing — keep it off
  # so the native modules load.
  hardenedRuntime: false
  # No fixed arch list: the architecture is driven by the build command
  # (electron-builder --arm64 / --x64) or defaults to the host arch. This
  # keeps each CI runner building only its own architecture, so the native
  # prebuilds (onnxruntime-node, nut-js are fetched per host arch)
  # match the target instead of shipping arm64 binaries inside an x64 dmg.
  # Apple Silicon only: onnxruntime-node (pinned 1.24.3) ships no darwin/x64
  # prebuild, so an Intel build could not load Whisper.
  target:
    - dmg
  category: public.app-category.productivity

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

win:
  icon: assets/icon.ico
  target:
    - target: nsis

nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}

linux:
  icon: assets/icon.png
  # Explicit, lowercase, space-free binary name (CI smoke test runs
  # dist/linux-unpacked/showhisper; also used for the .desktop Exec line).
  executableName: showhisper
  category: Utility
  synopsis: Local, private Whisper dictation
  description: >-
    Press a hotkey, speak, and your words are transcribed on-device with
    Whisper and pasted into whatever app you're in. Fully offline.
  maintainer: adziendziolD <adziendziolD@users.noreply.github.com>
  vendor: Adziendz
  # Only x64: CI builds on an x64 runner, and the native prebuilds
  # (node-llama-cpp, libnut, ffmpeg-static) are fetched for the host arch.
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # node-llama-cpp's CUDA prebuilds (@node-llama-cpp/linux-x64-cuda*, ~550 MB
  # unpacked) would bloat the AppImage/deb enormously. Drop them; node-llama-cpp
  # then falls back to its Vulkan or CPU build. (Merged with root `files`.)
  files:
    - "!**/node_modules/@node-llama-cpp/linux-x64-cuda/**"
    - "!**/node_modules/@node-llama-cpp/linux-x64-cuda-ext/**"

appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # Replaces electron-builder's default list, so it repeats Electron's own
  # runtime deps plus libX11 + libXtst, the only extra libs libnut.node (the
  # nut-js paste simulation) links against, and ALSA for microphone capture.
  # The `|` alternatives cover Ubuntu 24.04's t64 package renames.
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libx11-6
    - libasound2 | libasound2t64
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0

# Generates latest.yml / latest-linux.yml (+ app-update.yml inside the app)
# for electron-updater. CI builds with --publish never and the release job
# uploads the files itself (see .github/workflows/build.yml).
publish:
  provider: github
  owner: adziendziolD
  repo: SHOWhisper
  releaseType: release

files:
  - "**/*"
  - "!node_modules/electron-builder/**"
  # Repo-only content (Homebrew cask, install scripts, docs) - not app code.
  - "!Casks/**"
  - "!scripts/**"
  - "!docs/**"

asar: true
# Native modules must be unpacked from the asar archive, otherwise the loader
# can't find the *.node/*.dylib binaries in the packaged build (the app starts
# locally via `npm start`, but the .dmg version fails to load the modules).
# - node-llama-cpp resolves the llama.cpp shared libs and metadata from its
#   bins/llama dirs and the per-platform @node-llama-cpp/* prebuild packages,
#   not just the *.node addon - all must be unpacked.
# - ffmpeg-static ships a plain ffmpeg binary that we spawn; require('ffmpeg-static')
#   returns a path inside app.asar, so it must live in .unpacked (see main.js).
asarUnpack:
  - "**/node_modules/@nut-tree-fork/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/*.node"
  - "**/node_modules/node-llama-cpp/bins/**"
  - "**/node_modules/node-llama-cpp/llama/**"
  - "**/node_modules/@node-llama-cpp/**"
  - "**/node_modules/ffmpeg-static/**"
